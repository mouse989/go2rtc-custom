name: Build and Push

on:
  workflow_dispatch:
    # Builds are now done locally using scripts/ — trigger this workflow
    # manually only when you need CI-built artifacts.
    # Local build scripts:
    #   go2rtc binaries : scripts/build.sh (Linux/Mac) or scripts/build.cmd (Windows)
    #   https-proxy     : scripts/build_https_proxy_win.bat (Windows)
    #                     scripts/build_https_proxy.sh (Linux/Mac)
    #   yolo_counter    : scripts/build_yolo_linux.sh (Linux)
    #                     scripts/build_yolo_win.bat  (Windows CPU)
    # NOTE: GPU (CUDA) builds are done locally only — see yolo_counter/BUILD_GUIDE.md
    #   Windows GPU: scripts/setup_yolo_win.bat / setup_yolo_win_gpu.bat (venv)
    #   Linux GPU  : scripts/setup_yolo_linux_gpu.sh (venv, recommended)

jobs:
  build-windows:
    name: Build go2rtc + https-proxy (Windows Server)
    runs-on: windows-latest
    env: { CGO_ENABLED: 0, GOOS: windows, GOARCH: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Vet
        run: go vet . ./cmd/https-proxy

      - name: Build go2rtc.exe
        run: go build -ldflags "-s -w" -trimpath -o go2rtc.exe .

      - name: Build https-proxy.exe
        run: go build -ldflags "-s -w" -trimpath -o https-proxy.exe ./cmd/https-proxy

      - name: Smoke test
        shell: pwsh
        run: |
          .\go2rtc.exe -version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\https-proxy.exe -h 2>&1 | Out-Host
          (Get-Item go2rtc.exe, https-proxy.exe) | Format-Table Name, Length

      # Ready-to-copy folder: same layout run.bat / run-https-proxy.bat expect
      - name: Assemble bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bundle\dist | Out-Null
          Copy-Item go2rtc.exe bundle\dist\go2rtc-custom.exe
          Copy-Item https-proxy.exe bundle\dist\https-proxy.exe
          Copy-Item run.bat, run-https-proxy.bat bundle\
          Copy-Item cmd\https-proxy\README.md bundle\https-proxy-README.md

      - name: Upload go2rtc_win64
        uses: actions/upload-artifact@v4
        with: { name: go2rtc_win64, path: go2rtc.exe }

      - name: Upload https_proxy_win64
        uses: actions/upload-artifact@v4
        with: { name: https_proxy_win64, path: https-proxy.exe }

      - name: Upload go2rtc_bundle_win64
        uses: actions/upload-artifact@v4
        with: { name: go2rtc_bundle_win64, path: bundle }

  build-linux:
    name: Build go2rtc + https-proxy (Linux)
    runs-on: ubuntu-latest
    env: { CGO_ENABLED: 0, GOOS: linux, GOARCH: amd64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Build go2rtc_linux_amd64
        run: go build -ldflags "-s -w" -trimpath -o go2rtc .
      - name: Upload go2rtc_linux_amd64
        uses: actions/upload-artifact@v4
        with: { name: go2rtc_linux_amd64, path: go2rtc }

      - name: Build https-proxy (Linux)
        run: go build -ldflags "-s -w" -trimpath -o https-proxy ./cmd/https-proxy
      - name: Upload https_proxy_linux_amd64
        uses: actions/upload-artifact@v4
        with: { name: https_proxy_linux_amd64, path: https-proxy }

  build-yolo-win64:
    name: Build yolo_counter.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install CPU-only PyTorch (lighter build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ultralytics, opencv, web stack, PyInstaller
        run: pip install ultralytics opencv-python-headless fastapi "uvicorn[standard]" pyinstaller

      - name: Build yolo_counter.exe
        run: pyinstaller --onefile --name yolo_counter yolo_counter/counter.py

      - name: Upload yolo_counter_win64
        uses: actions/upload-artifact@v4
        with:
          name: yolo_counter_win64
          path: dist\yolo_counter.exe

  build-yolo-linux64:
    name: Build yolo_counter (Linux x64)
    runs-on: ubuntu-22.04
    container:
      image: python:3.11-slim-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system libs
        run: apt-get update -y && apt-get install -y libglib2.0-0 libgl1 binutils

      - name: Install CPU-only PyTorch (lighter build)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ultralytics, opencv, web stack, PyInstaller
        run: pip install ultralytics opencv-python-headless fastapi "uvicorn[standard]" pyinstaller

      - name: Build yolo_counter
        run: pyinstaller --onefile --name yolo_counter yolo_counter/counter.py

      - name: Upload yolo_counter_linux64
        uses: actions/upload-artifact@v4
        with:
          name: yolo_counter_linux64
          path: dist/yolo_counter
