<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs – UTMC Platform</title>
<link rel="stylesheet" href="app.css">
<style>
.log-toolbar { display:flex; align-items:center; gap:.5rem; margin-bottom:1rem; flex-wrap:wrap; }
.log-toolbar .spacer { flex:1; }
.log-count { font-size:.78rem; color:var(--text-muted); }

.log-wrap {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); overflow:hidden;
}
.log-table { width:100%; border-collapse:collapse; font-family:monospace; font-size:.78rem; }
.log-table th {
  position:sticky; top:0; background:var(--surface2);
  text-align:left; padding:.5rem .8rem; font-size:.7rem;
  text-transform:uppercase; letter-spacing:.05em; color:var(--text-muted);
  border-bottom:1px solid var(--border); font-family:inherit;
}
.log-table td { padding:.3rem .8rem; border-bottom:1px solid var(--border-soft,var(--border)); vertical-align:top; }
.log-table tr:last-child td { border-bottom:none; }
.log-time  { white-space:nowrap; color:var(--text-muted); width:110px; }
.log-level { width:60px; }
.log-msg   { word-break:break-word; color:var(--text); }

.lv {
  display:inline-block; padding:.05rem .45rem; border-radius:4px;
  font-size:.68rem; font-weight:700; text-transform:uppercase;
}
.lv.trace { background:#37415122; color:#6b7280; }
.lv.debug { background:#4b556322; color:#9ca3af; }
.lv.info  { background:#1d4ed822; color:#60a5fa; }
.lv.warn  { background:#92400e22; color:#fbbf24; }
.lv.error, .lv.fatal, .lv.panic { background:#7f1d1d22; color:#f87171; }

.sev {
  display:inline-block; padding:.05rem .5rem; border-radius:4px;
  font-size:.68rem; font-weight:700; text-transform:uppercase;
}
.sev.low    { background:#1d4ed822; color:#60a5fa; }
.sev.medium { background:#92400e22; color:#fbbf24; }
.sev.high   { background:#7f1d1d22; color:#f87171; }
.res-ok  { color:var(--green,#3fb950); font-weight:600; }
.res-bad { color:var(--red,#f85149); font-weight:600; }

.log-scroll { max-height:calc(100vh - 210px); overflow-y:auto; -webkit-overflow-scrolling:touch; }
.log-empty { text-align:center; color:var(--text-muted); padding:2.5rem; font-size:.85rem; }
@media (max-width:768px) {
  .topbar { flex-wrap:wrap; height:auto !important; padding:8px 12px !important; gap:6px; }
  .log-scroll { max-height:calc(100vh - 160px); overflow-x:auto; }
  .log-time { width:90px !important; }
  .log-level { width:48px !important; font-size:.73rem !important; }
  .log-table th { font-size:.75rem !important; }
}
</style>
</head>

<script src="app.js"></script>
<script>
const LEVEL_ORDER = { trace:0, debug:1, info:2, warn:3, error:4, fatal:5, panic:6 };
let autoUpdate = true;
let newestFirst = true;
let minLevel = 'info';

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseLines(text) {
  const out = [];
  for (const raw of text.split('\n')) {
    const t = raw.trim();
    if (!t) continue;
    try { out.push(JSON.parse(t)); } catch(_) {}
  }
  return out;
}

function fmtLine(line) {
  const KEYS = ['time','level','message'];
  const ts = line.time ? new Date(line.time).toLocaleTimeString(undefined, {
    hour:'numeric', minute:'numeric', second:'numeric', fractionalSecondDigits:3,
  }) : '—';
  let msg = line.message || '';
  for (const k of Object.keys(line)) {
    if (!KEYS.includes(k)) msg += ` ${k}=${line[k]}`;
  }
  const lv = line.level || 'info';
  return `<tr>
    <td class="log-time">${escHtml(ts)}</td>
    <td class="log-level"><span class="lv ${escHtml(lv)}">${escHtml(lv)}</span></td>
    <td class="log-msg">${escHtml(msg)}</td>
  </tr>`;
}

async function reload() {
  try {
    const token = getToken();
    const res = await fetch('/api/log', token ? { headers: { Authorization: 'Bearer ' + token } } : {});
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    if (!res.ok) throw new Error(await res.text().catch(() => res.statusText));
    const text = await res.text();
    let lines = parseLines(text);

    const min = LEVEL_ORDER[minLevel] ?? 0;
    lines = lines.filter(l => (LEVEL_ORDER[l.level] ?? 2) >= min);

    if (newestFirst) lines = lines.reverse();

    document.getElementById('logCount').textContent = lines.length + ' entries';
    document.getElementById('logBody').innerHTML = lines.length
      ? lines.map(fmtLine).join('')
      : '<tr><td colspan="3" class="log-empty">No log entries.</td></tr>';
  } catch(e) {
    document.getElementById('logBody').innerHTML =
      `<tr><td colspan="3" class="log-empty">Cannot load logs: ${escHtml(e.message)}</td></tr>`;
  }
}

document.getElementById('btnClean').addEventListener('click', async () => {
  if (!confirm('Delete all server logs?')) return;
  try {
    await apiFetch('/api/log', { method: 'DELETE' });
    await reload();
  } catch(e) { alert('Clean failed: ' + e.message); }
});

document.getElementById('btnAuto').addEventListener('click', () => {
  autoUpdate = !autoUpdate;
  document.getElementById('btnAuto').textContent =
    (autoUpdate ? '⏸' : '▶') + ' Auto-update: ' + (autoUpdate ? 'ON' : 'OFF');
});

document.getElementById('btnReverse').addEventListener('click', () => {
  newestFirst = !newestFirst;
  document.getElementById('btnReverse').textContent =
    '↕ Newest first: ' + (newestFirst ? 'ON' : 'OFF');
  reload();
});

document.getElementById('levelFilter').addEventListener('change', e => {
  minLevel = e.target.value || 'trace';
  reload();
});

// ── Camera access log (admin only) ──────────────────────────────
let accEntries = [];

function fmtAccTime(iso) {
  try { return new Date(iso).toLocaleString('vi-VN', { hour12: false }); }
  catch { return iso || '—'; }
}

function renderAccessLog() {
  const q = (document.getElementById('accSearch').value || '').toLowerCase();
  const rows = q
    ? accEntries.filter(e => (e.user || '').toLowerCase().includes(q) || (e.stream || '').toLowerCase().includes(q))
    : accEntries;

  document.getElementById('accCount').textContent = rows.length + ' lượt truy cập';
  document.getElementById('accBody').innerHTML = rows.length
    ? rows.map(e => `<tr>
        <td class="log-time">${escHtml(fmtAccTime(e.time))}</td>
        <td>${escHtml(e.user || '')}</td>
        <td>${escHtml(e.stream || '')}</td>
        <td>${escHtml(e.kind || '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="4" class="log-empty">Không có dữ liệu trong khoảng ngày đã chọn.</td></tr>';
}

async function loadAccessLog() {
  document.getElementById('accBody').innerHTML = '<tr><td colspan="4" class="log-empty">Loading…</td></tr>';
  try {
    const from = document.getElementById('accFrom').value;
    const to = document.getElementById('accTo').value;
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    const entries = await apiFetch('/api/access-log?' + params.toString());
    // Newest first
    accEntries = (entries || []).slice().reverse();
    renderAccessLog();
  } catch (e) {
    document.getElementById('accBody').innerHTML =
      `<tr><td colspan="4" class="log-empty">Cannot load access log: ${escHtml(e.message)}</td></tr>`;
  }
}

document.getElementById('btnAccFilter').addEventListener('click', loadAccessLog);
document.getElementById('accSearch').addEventListener('input', renderAccessLog);

// ── Login history (admin only) ──────────────────────────────────
let loginEntries = [];

function renderLoginLog() {
  const q = (document.getElementById('loginSearch').value || '').toLowerCase();
  const rows = q
    ? loginEntries.filter(e => (e.username || '').toLowerCase().includes(q) || (e.ip || '').toLowerCase().includes(q))
    : loginEntries;

  document.getElementById('loginCount').textContent = rows.length + ' lượt đăng nhập';
  document.getElementById('loginBody').innerHTML = rows.length
    ? rows.map(e => `<tr>
        <td class="log-time">${escHtml(fmtAccTime(e.time))}</td>
        <td>${escHtml(e.username || '')}</td>
        <td>${escHtml(e.ip || '')}</td>
        <td>${e.success ? '<span class="res-ok">✓ Thành công</span>' : '<span class="res-bad">✗ Thất bại</span>'}</td>
        <td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${escHtml(e.user_agent || '')}">${escHtml(e.user_agent || '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="5" class="log-empty">Không có dữ liệu trong khoảng ngày đã chọn.</td></tr>';
}

async function loadLoginLog() {
  document.getElementById('loginBody').innerHTML = '<tr><td colspan="5" class="log-empty">Loading…</td></tr>';
  try {
    const from = document.getElementById('loginFrom').value;
    const to = document.getElementById('loginTo').value;
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    const entries = await apiFetch('/api/login-history?' + params.toString());
    loginEntries = (entries || []).slice().reverse();
    renderLoginLog();
  } catch (e) {
    document.getElementById('loginBody').innerHTML =
      `<tr><td colspan="5" class="log-empty">Cannot load login history: ${escHtml(e.message)}</td></tr>`;
  }
}

document.getElementById('btnLoginFilter').addEventListener('click', loadLoginLog);
document.getElementById('loginSearch').addEventListener('input', renderLoginLog);

// ── Security alerts (admin only) ────────────────────────────────
let alertEntries = [];
const SEV_LABEL = { low: 'Thấp', medium: 'Trung bình', high: 'Cao' };
const TYPE_LABEL = {
  login_lockout: 'Khóa đăng nhập',
  new_ip: 'IP mới',
  concurrent_ip: 'Đăng nhập trùng IP',
  off_hours_login: 'Ngoài giờ',
  unauthorized_access: 'Truy cập trái phép',
};

function renderAlerts() {
  const q = (document.getElementById('alertSearch').value || '').toLowerCase();
  const rows = q
    ? alertEntries.filter(a =>
        (a.username || '').toLowerCase().includes(q) ||
        (a.ip || '').toLowerCase().includes(q) ||
        (a.type || '').toLowerCase().includes(q))
    : alertEntries;

  document.getElementById('alertCount').textContent = rows.length + ' cảnh báo';
  document.getElementById('alertBody').innerHTML = rows.length
    ? rows.map(a => `<tr>
        <td class="log-time">${escHtml(fmtAccTime(a.time))}</td>
        <td><span class="sev ${escHtml(a.severity || 'low')}">${escHtml(SEV_LABEL[a.severity] || a.severity || '')}</span></td>
        <td>${escHtml(TYPE_LABEL[a.type] || a.type || '')}</td>
        <td>${escHtml(a.username || '')}</td>
        <td>${escHtml(a.ip || '')}</td>
        <td class="log-msg">${escHtml(a.message || '')}</td>
      </tr>`).join('')
    : '<tr><td colspan="6" class="log-empty">Không có cảnh báo trong khoảng ngày đã chọn.</td></tr>';
}

async function loadAlerts() {
  document.getElementById('alertBody').innerHTML = '<tr><td colspan="6" class="log-empty">Loading…</td></tr>';
  try {
    const from = document.getElementById('alertFrom').value;
    const to = document.getElementById('alertTo').value;
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    const entries = await apiFetch('/api/security-alerts?' + params.toString());
    alertEntries = (entries || []).slice().reverse();
    renderAlerts();
  } catch (e) {
    document.getElementById('alertBody').innerHTML =
      `<tr><td colspan="6" class="log-empty">Cannot load security alerts: ${escHtml(e.message)}</td></tr>`;
  }
}

document.getElementById('btnAlertFilter').addEventListener('click', loadAlerts);
document.getElementById('alertSearch').addEventListener('input', renderAlerts);

function switchLogTab(name) {
  const tabs = {
    server: ['tabBtnServer', 'tabServerLog'],
    access: ['tabBtnAccess', 'tabAccessLog'],
    login:  ['tabBtnLogin', 'tabLoginLog'],
    alerts: ['tabBtnAlerts', 'tabAlerts'],
  };
  for (const key in tabs) {
    const [btnId, panelId] = tabs[key];
    document.getElementById(btnId).classList.toggle('active', key === name);
    document.getElementById(panelId).style.display = key === name ? '' : 'none';
  }
  if (name === 'access' && !accEntries.length) loadAccessLog();
  if (name === 'login' && !loginEntries.length) loadLoginLog();
  if (name === 'alerts' && !alertEntries.length) loadAlerts();
}

document.getElementById('tabBtnServer').addEventListener('click', () => switchLogTab('server'));
document.getElementById('tabBtnAccess').addEventListener('click', () => switchLogTab('access'));
document.getElementById('tabBtnLogin').addEventListener('click', () => switchLogTab('login'));
document.getElementById('tabBtnAlerts').addEventListener('click', () => switchLogTab('alerts'));

// ── Boot ──
(async () => {
  await initApp('log');
  const user = getUser();
  if (!user || !hasTab('log')) { window.location.href = '/'; return; }

  if (isAdmin()) {
    const today = new Date().toISOString().slice(0, 10);
    document.getElementById('accFrom').value = today;
    document.getElementById('accTo').value = today;
    document.getElementById('loginFrom').value = today;
    document.getElementById('loginTo').value = today;
    document.getElementById('alertFrom').value = today;
    document.getElementById('alertTo').value = today;
  } else {
    document.getElementById('tabBtnAccess').style.display = 'none';
    document.getElementById('tabBtnLogin').style.display = 'none';
    document.getElementById('tabBtnAlerts').style.display = 'none';
  }

  await reload();
  setInterval(() => { if (autoUpdate) reload(); }, 5000);
})();
</script>
