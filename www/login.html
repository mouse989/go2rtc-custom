<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTMC PLATFORM - Trung Tâm Quản Lý Điều Hành Giao Thông Đô Thị</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #050b16;
            --bg-card: rgba(10, 19, 35, 0.82);
            --bg-card-border: rgba(0, 240, 255, 0.35);
            --accent-cyan: #00f0ff;
            --accent-blue: #0077ff;
            --accent-glow: rgba(0, 240, 255, 0.5);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(148, 163, 184, 0.28);
            --input-focus: #00f0ff;
            --danger: #f85149;
            --radius-lg: 22px;
            --radius-md: 12px;
            --transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-primary);
            background-color: var(--bg-deep);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Canvas mô phỏng mạng lưới các điểm tròn kết nối và các chấm di chuyển */
        #networkCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Lớp ánh sáng nền viễn thám nhẹ */
        .ambient-glow {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 15% 20%, rgba(0, 119, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(0, 240, 255, 0.14) 0%, transparent 50%),
                linear-gradient(to bottom, rgba(5, 11, 22, 0.5) 0%, rgba(3, 7, 15, 0.85) 100%);
            pointer-events: none;
            z-index: 2;
        }

        /* Top Navigation Bar */
        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 44px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(5, 11, 22, 0.72);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }

        .topbar-brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-logo-container {
            display: flex;
            align-items: center;
            height: 38px;
        }

        .brand-logo-img {
            height: 36px;
            width: auto;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }

        .brand-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 0.8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 0.84rem;
            font-weight: 500;
            color: #e2e8f0;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.45);
            padding: 6px 18px;
            border-radius: 30px;
            box-shadow: 0 0 18px rgba(16, 185, 129, 0.25);
            backdrop-filter: blur(8px);
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 12px #10b981;
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.35; transform: scale(0.8); }
        }

        /* Thẻ Đăng Nhập Trung Tâm */
        .login-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 440px;
            padding: calc(88px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
            margin: auto;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(34px) saturate(180%);
            -webkit-backdrop-filter: blur(34px) saturate(180%);
            padding: 38px 36px 30px;
            box-shadow:
                0 32px 85px -15px rgba(0, 0, 0, 0.9),
                0 0 50px -10px rgba(0, 240, 255, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
            animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(22px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Dải sáng neon cyan trên đỉnh thẻ */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            box-shadow: 0 0 16px var(--accent-cyan);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .center-logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 22px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
            margin-bottom: 16px;
        }

        .center-logo-badge img {
            height: 42px;
            width: auto;
            display: block;
        }

        .auth-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            font-size: 0.83rem;
            color: var(--text-secondary);
            line-height: 1.5;
            font-weight: 400;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .field-label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
            transition: var(--transition);
        }

        .form-input {
            width: 100%;
            height: 50px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            color: #ffffff;
            font-size: 0.94rem;
            font-family: inherit;
            padding: 0 44px 0 46px;
            outline: none;
            transition: var(--transition);
        }

        .form-input::placeholder {
            color: #64748b;
        }

        .form-input:hover {
            border-color: rgba(0, 240, 255, 0.45);
            background: rgba(255, 255, 255, 0.08);
        }

        .form-input:focus {
            border-color: var(--input-focus);
            background: rgba(0, 240, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.2);
        }

        .form-input:focus ~ .input-icon {
            color: var(--accent-cyan);
        }

        .btn-toggle-pw {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
            transition: var(--transition);
        }

        .btn-toggle-pw:hover {
            color: var(--accent-cyan);
        }

        /* Row ghi nhớ + quên mật khẩu */
        .options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-secondary);
            user-select: none;
        }

        .remember-checkbox input {
            accent-color: var(--accent-cyan);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .forgot-pw-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
            background: none;
            border: none;
            font-family: inherit;
            cursor: pointer;
            padding: 0;
        }

        .forgot-pw-link:hover {
            color: #ffffff;
            text-decoration: underline;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        /* Thông báo quên mật khẩu (không có flow thật, chỉ hướng dẫn liên hệ admin) */
        .forgot-pw-note {
            display: none;
            font-size: 0.76rem;
            color: var(--text-secondary);
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin: -10px 0 20px;
            line-height: 1.5;
        }
        .forgot-pw-note.show { display: block; }

        /* Thông báo lỗi đăng nhập */
        .login-error {
            display: none;
            font-size: 0.82rem;
            color: var(--danger);
            background: rgba(248, 81, 73, 0.1);
            border: 1px solid rgba(248, 81, 73, 0.35);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .login-error.show { display: block; }

        /* Nút Đăng nhập chính chuẩn Mockup */
        .btn-submit-login {
            width: 100%;
            height: 50px;
            background: linear-gradient(135deg, #0077ff 0%, #00f0ff 100%);
            border: none;
            border-radius: var(--radius-md);
            color: #ffffff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 26px -4px rgba(0, 119, 255, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .btn-submit-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px -4px rgba(0, 240, 255, 0.7);
        }

        .btn-submit-login:active {
            transform: translateY(1px);
        }

        .btn-submit-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Footer bản quyền */
        .auth-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            text-align: center;
            font-size: 0.74rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* Loading Overlay Radar Scanner */
        .radar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 11, 22, 0.9);
            backdrop-filter: blur(14px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .radar-overlay.active {
            display: flex;
        }

        .radar-spinner {
            width: 76px;
            height: 76px;
            position: relative;
        }

        .radar-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid transparent;
        }

        .radar-ring:nth-child(1) {
            border-top-color: var(--accent-cyan);
            animation: spin 1s linear infinite;
        }

        .radar-ring:nth-child(2) {
            inset: 10px;
            border-right-color: #0077ff;
            animation: spinRev 1.4s linear infinite;
        }

        .radar-ring:nth-child(3) {
            inset: 22px;
            border-bottom-color: #38bdf8;
            animation: spin 2s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes spinRev { to { transform: rotate(-360deg); } }

        .loader-text {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        @media (max-width: 600px) {
            .topbar { padding: 0 16px; height: 60px; }
            .brand-logo-img { height: 28px; }
            .brand-title { font-size: 1.05rem; }
            .login-wrapper { padding: 80px 16px 20px; }
            .auth-card { padding: 30px 22px 24px; }
            .auth-title { font-size: 1.55rem; }
        }
    </style>
</head>

                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập" required autocomplete="username">
                    </div>
                </div>

                <!-- Mật khẩu -->
                <div class="form-group">
                    <label class="field-label" for="password">Mật khẩu</label>
                    <div class="input-box">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pw" id="togglePasswordBtn" title="Hiện/ẩn mật khẩu">
                            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Tuỳ chọn: Ghi nhớ & Quên mật khẩu -->
                <div class="options-row">
                    <label class="remember-checkbox">
                        <input type="checkbox" id="rememberMe">
                        <span>Ghi nhớ đăng nhập</span>
                    </label>
                    <button type="button" class="forgot-pw-link" id="forgotPwBtn">Quên mật khẩu?</button>
                </div>

                <div class="forgot-pw-note" id="forgotPwNote">
                    Hệ thống chưa hỗ trợ tự đặt lại mật khẩu — vui lòng liên hệ quản trị viên để được cấp lại.
                </div>

                <div class="login-error" id="loginError"></div>

                <!-- Nút ĐĂNG NHẬP -->
                <button type="submit" class="btn-submit-login" id="btnSubmit">
                    <span id="btnSubmitLabel">ĐĂNG NHẬP</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>

            <!-- Chân trang thẻ đăng nhập -->
            <footer class="auth-footer">
                <div>© 2026 UTMC Platform</div>
            </footer>
        </div>
    </main>

    <!-- Radar Loading Overlay -->
    <div class="radar-overlay" id="loadingOverlay">
        <div class="radar-spinner">
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
            <div class="radar-ring"></div>
        </div>
        <div class="loader-text">Đang đăng nhập...</div>
    </div>

    <!-- Nền động: mạng lưới các điểm tròn kết nối và các chấm di chuyển -->
    <script>
        const canvas = document.getElementById('networkCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initMeshNetwork();
        });

        let nodes = [];
        let particles = [];

        function initMeshNetwork() {
            nodes = [];
            particles = [];

            // 1. Tạo các điểm tròn mạng lưới (Nodes) trôi nhẹ nhàng trong không gian
            const numNodes = Math.min(48, Math.floor((width * height) / 28000));
            for (let i = 0; i < numNodes; i++) {
                nodes.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * 0.45,
                    vy: (Math.random() - 0.5) * 0.45,
                    radius: 2.5 + Math.random() * 2,
                    pulse: Math.random() * Math.PI * 2
                });
            }

            // 2. Tạo danh sách các chấm chuyển động (telemetry particles)
            const colors = ['#00f0ff', '#00f0ff', '#10b981', '#10b981', '#38bdf8', '#fbbf24'];
            const numParticles = Math.min(36, Math.floor(numNodes * 0.8));

            for (let i = 0; i < numParticles; i++) {
                particles.push({
                    fromNodeIndex: Math.floor(Math.random() * nodes.length),
                    toNodeIndex: Math.floor(Math.random() * nodes.length),
                    progress: Math.random(),
                    speed: 0.003 + Math.random() * 0.004,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    radius: Math.random() > 0.4 ? (3.5 + Math.random() * 1.5) : (2 + Math.random() * 0.8)
                });
            }
        }

        initMeshNetwork();

        function render() {
            ctx.clearRect(0, 0, width, height);

            nodes.forEach(node => {
                node.x += node.vx;
                node.y += node.vy;
                if (node.x < 0 || node.x > width) node.vx *= -1;
                if (node.y < 0 || node.y > height) node.vy *= -1;
                node.pulse += 0.03;
            });

            const maxDistance = Math.min(220, width * 0.25);

            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < maxDistance) {
                        const alpha = (1 - dist / maxDistance) * 0.35;
                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                        ctx.lineWidth = 1.2;
                        ctx.stroke();
                    }
                }
            }

            nodes.forEach(node => {
                const r = node.radius + Math.sin(node.pulse) * 1.2;
                ctx.beginPath();
                ctx.arc(node.x, node.y, r * 2.8, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 240, 255, 0.08)';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
                ctx.fillStyle = '#00f0ff';
                ctx.shadowColor = '#00f0ff';
                ctx.shadowBlur = 10;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            particles.forEach(p => {
                p.progress += p.speed;

                if (p.progress >= 1) {
                    p.progress = 0;
                    p.fromNodeIndex = p.toNodeIndex;
                    let availableNodes = [];
                    for (let k = 0; k < nodes.length; k++) {
                        if (k !== p.fromNodeIndex) {
                            const d = Math.hypot(nodes[p.fromNodeIndex].x - nodes[k].x, nodes[p.fromNodeIndex].y - nodes[k].y);
                            if (d < maxDistance * 1.3) availableNodes.push(k);
                        }
                    }
                    if (availableNodes.length > 0) {
                        p.toNodeIndex = availableNodes[Math.floor(Math.random() * availableNodes.length)];
                    } else {
                        p.toNodeIndex = Math.floor(Math.random() * nodes.length);
                    }
                }

                const n1 = nodes[p.fromNodeIndex];
                const n2 = nodes[p.toNodeIndex];
                if (!n1 || !n2) return;

                const curX = n1.x + (n2.x - n1.x) * p.progress;
                const curY = n1.y + (n2.y - n1.y) * p.progress;

                ctx.beginPath();
                ctx.arc(curX, curY, p.radius * 2.2, 0, Math.PI * 2);
                ctx.fillStyle = p.color === '#00f0ff' ? 'rgba(0, 240, 255, 0.22)' : 'rgba(16, 185, 129, 0.22)';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(curX, curY, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 12;
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.beginPath();
                ctx.arc(curX, curY, p.radius * 0.45, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
            });

            requestAnimationFrame(render);
        }

        render();

        // Bật/tắt hiện mật khẩu
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const pwInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        toggleBtn.addEventListener('click', () => {
            const isPassword = pwInput.type === 'password';
            pwInput.type = isPassword ? 'text' : 'password';
            eyeIcon.style.color = isPassword ? 'var(--accent-cyan)' : 'currentColor';
        });

        // "Quên mật khẩu?" — chưa có flow tự đặt lại, chỉ hướng dẫn liên hệ admin
        document.getElementById('forgotPwBtn').addEventListener('click', () => {
            document.getElementById('forgotPwNote').classList.toggle('show');
        });

        // ── Đăng nhập thật: POST /api/auth/login → /api/auth/me → điều hướng ──
        const loginForm = document.getElementById('loginForm');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loginError = document.getElementById('loginError');
        const btnSubmit = document.getElementById('btnSubmit');
        const btnSubmitLabel = document.getElementById('btnSubmitLabel');

        function showError(msg) {
            loginError.textContent = msg;
            loginError.classList.add('show');
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmitLabel.textContent = 'ĐANG ĐĂNG NHẬP…';
            loginError.classList.remove('show');
            loadingOverlay.classList.add('active');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('go2rtc_token', data.token);
                    // Flag this login for a one-time, best-effort GPS capture on the
                    // next authenticated page load (see app.js's maybeCaptureLoginLocation)
                    // — not done here so it never delays/blocks the redirect below.
                    localStorage.setItem('go2rtc_geo_pending', '1');
                    // Fetch full profile (includes tabs) to determine redirect target.
                    try {
                        const meRes = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + data.token } });
                        if (meRes.ok) {
                            const me = await meRes.json();
                            localStorage.setItem('go2rtc_user', JSON.stringify(me));
                            if (me.must_change_password) {
                                window.location.href = '/change-password.html';
                                return;
                            }
                            // Same tab→page order as app.js's firstPermittedPage (kept in
                            // sync manually since this page runs before app.js is loaded).
                            const order = [
                                { tab: 'map',       page: '/map.html' },
                                { tab: 'cameras',   page: '/' },
                                { tab: 'dashboard', page: '/dashboard.html' },
                                { tab: 'monitor',   page: '/monitor.html' },
                                { tab: 'log',       page: '/log.html' },
                                { tab: 'config',    page: '/config.html' },
                                { tab: 'api_docs',  page: '/api-docs.html' },
                                { tab: 'counting',  page: '/counting.html' },
                                { tab: 'incidents', page: '/incidents.html' },
                            ];
                            let dest = me.role === 'admin' ? '/map.html' : null;
                            if (!dest) for (const { tab, page } of order) {
                                if ((me.tabs || []).includes(tab)) { dest = page; break; }
                            }
                            window.location.href = dest || '/no-access.html';
                            return;
                        }
                    } catch {}
                    // Fallback if /api/auth/me fails
                    localStorage.setItem('go2rtc_user', JSON.stringify({ username: data.username, role: data.role }));
                    window.location.href = data.must_change_password ? '/change-password.html'
                        : data.role === 'admin' ? '/' : '/no-access.html';
                } else {
                    let msg = 'Sai tên đăng nhập hoặc mật khẩu.';
                    try {
                        const body = await res.json();
                        if (res.status === 429 && body.error) msg = body.error;
                    } catch {}
                    loadingOverlay.classList.remove('active');
                    showError(msg);
                }
            } catch {
                loadingOverlay.classList.remove('active');
                showError('Lỗi kết nối — máy chủ có thể đang offline.');
            } finally {
                btnSubmit.disabled = false;
                btnSubmitLabel.textContent = 'ĐĂNG NHẬP';
            }
        });
    </script>
</body>
</html>
