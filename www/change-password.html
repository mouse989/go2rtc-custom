<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTMC Platform — Change Password</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --border:   #30363d;
      --text:     #e6edf3;
      --muted:    #8b949e;
      --accent:   #2f81f7;
      --accent-h: #388bfd;
      --danger:   #f85149;
      --radius:   10px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,.4);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .75rem;
      justify-content: center;
    }
    .logo h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.5px; }
    .logo span { color: var(--accent); }

    .lead {
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .35rem;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    input {
      width: 100%;
      padding: .65rem .9rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 1rem;
    }
    input:focus { border-color: var(--accent); }

    button {
      width: 100%;
      padding: .75rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: .5rem;
    }
    button:hover { background: var(--accent-h); }
    button:disabled { opacity: .55; cursor: not-allowed; }

    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: .6rem;
    }
    .btn-secondary:hover { background: rgba(255,255,255,.04); color: var(--text); }

    .error {
      background: rgba(248,81,73,.12);
      border: 1px solid rgba(248,81,73,.4);
      color: var(--danger);
      border-radius: 6px;
      padding: .65rem .9rem;
      font-size: .9rem;
      margin-top: 1rem;
      display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="logo.png" alt="UTMC" style="height:48px;width:auto">
    <h1><span>Platform</span></h1>
  </div>
  <p class="lead" id="lead">Bạn cần đặt mật khẩu mới cho tài khoản này trước khi tiếp tục.</p>

  <form id="form">
    <label for="current">Mật khẩu hiện tại</label>
    <input id="current" type="password" autocomplete="current-password" required>

    <label for="pw1">Mật khẩu mới</label>
    <input id="pw1" type="password" autocomplete="new-password" minlength="6" required>

    <label for="pw2">Nhập lại mật khẩu mới</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>

    <button type="submit" id="btn">Đổi mật khẩu</button>
    <div class="error" id="err"></div>
  </form>
  <button type="button" class="btn-secondary" id="btnLogout">Đăng xuất</button>
</div>

<script>
function getToken() { return localStorage.getItem('go2rtc_token') || ''; }

async function apiMe(token) {
  const res = await fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } });
  if (!res.ok) throw new Error('unauthorized');
  return res.json();
}

function firstPermittedPage(u) {
  if (!u || u.role === 'admin') return '/map.html';
  const order = [
    { tab: 'map',       page: '/map.html' },
    { tab: 'cameras',   page: '/' },
    { tab: 'dashboard', page: '/dashboard.html' },
    { tab: 'monitor',   page: '/monitor.html' },
    { tab: 'log',       page: '/log.html' },
    { tab: 'config',    page: '/config.html' },
    { tab: 'api_docs',  page: '/api-docs.html' },
    { tab: 'counting',  page: '/counting.html' },
    { tab: 'incidents', page: '/incidents.html' },
  ];
  for (const { tab, page } of order) {
    if ((u.tabs || []).includes(tab)) return page;
  }
  return '/login.html?err=no_access';
}

(async () => {
  const token = getToken();
  if (!token) { window.location.href = '/login.html'; return; }

  let me;
  try {
    me = await apiMe(token);
  } catch {
    localStorage.removeItem('go2rtc_token');
    localStorage.removeItem('go2rtc_user');
    window.location.href = '/login.html';
    return;
  }
  localStorage.setItem('go2rtc_user', JSON.stringify(me));

  // Already changed (e.g. reached this page via back-button) — nothing to do here.
  if (!me.must_change_password) {
    window.location.href = firstPermittedPage(me);
    return;
  }

  document.getElementById('lead').textContent =
    `Xin chào ${me.username}. Bạn cần đặt mật khẩu mới cho tài khoản này trước khi tiếp tục.`;
})();

document.getElementById('btnLogout').addEventListener('click', async () => {
  try { await fetch('/api/auth/logout', { method: 'POST' }); } catch {}
  localStorage.removeItem('go2rtc_token');
  localStorage.removeItem('go2rtc_user');
  window.location.href = '/login.html';
});

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  err.classList.remove('show');

  const current = document.getElementById('current').value;
  const pw1 = document.getElementById('pw1').value;
  const pw2 = document.getElementById('pw2').value;

  if (pw1 !== pw2) {
    err.textContent = 'Mật khẩu mới nhập lại không khớp.';
    err.classList.add('show');
    return;
  }
  if (pw1 === current) {
    err.textContent = 'Mật khẩu mới phải khác mật khẩu hiện tại.';
    err.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Đang lưu…';

  try {
    const token = getToken();
    const res = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ current_password: current, new_password: pw1 }),
    });
    if (!res.ok) {
      const txt = await res.text().catch(() => '');
      throw new Error(txt || res.statusText);
    }
    const me = await apiMe(token);
    localStorage.setItem('go2rtc_user', JSON.stringify(me));
    window.location.href = firstPermittedPage(me);
  } catch (e) {
    err.textContent = e.message || 'Đổi mật khẩu thất bại.';
    err.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Đổi mật khẩu';
  }
});
</script>
</body>
</html>
